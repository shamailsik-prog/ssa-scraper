# Cloud overlay: puts Caddy in front of the API with automatic HTTPS.
#
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d --build
#
# or set COMPOSE_FILE=docker-compose.yml:docker-compose.cloud.yml in .env (cloud/install.sh does this)
# so plain `docker compose up -d` includes the overlay.
#
# With the overlay, set API_BIND=127.0.0.1 in .env so port 8000 is reachable only through Caddy.
# Caddy reads state/Caddyfile (git-ignored): cloud/install.sh writes it; for a manual set-up copy
# cloud/Caddyfile.example and edit the host line. The admin key, the human-login screencast and
# every keystroke typed into the streamed browser pass through this proxy, so TLS is not optional.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./state/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      # Ask Caddy's own admin endpoint (loopback only) whether it is serving; the public listener
      # redirects plain HTTP to HTTPS and serves a certificate for the server's IP, not 127.0.0.1,
      # so a probe through it always failed and the container showed "unhealthy" while working.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  caddydata:
  caddyconfig:
