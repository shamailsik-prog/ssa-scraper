name: deploy-cloud

# Creates (or updates) the corpus server on DigitalOcean and installs the service on it.
# Required repository secret: DO_TOKEN (DigitalOcean API token, read/write).
# Optional repository secret: SGAI_API_KEY (ScrapeGraph key; written to the server's .env, never printed).
# Optional repository secret: CORPUS_API_KEY (turns on the read-only corpus API /corpus/v1; written the same way).
# Run it from the Actions tab ("Run workflow"). The dashboard address appears in the job summary; the admin key is never
# printed (this repository is public) and stays in /opt/ssa-scraper/.env on the server.

on:
  workflow_dispatch:
    inputs:
      do_region:
        description: "DigitalOcean region (fra1 Frankfurt, lon1 London, ams3 Amsterdam, sgp1 Singapore, blr1 Bangalore)"
        default: fra1
        required: true
      do_size:
        description: "Droplet size (s-2vcpu-4gb ≈ $24/month, s-4vcpu-8gb ≈ $48/month)"
        default: s-2vcpu-4gb
        required: true
      domain:
        description: "DNS name pointing at the server (optional; leave blank to use the IP with a self-signed certificate)"
        default: ""
        required: false
      reporters:
        description: "PakistanLawSite reporters you subscribe to"
        default: "PLD,SCMR,CLC,PLC,MLD,YLR,PCrLJ"
        required: false
      earliest_year:
        description: "Earliest year your subscription reaches"
        default: "1990"
        required: false
      deploy_region_label:
        description: "Recorded as DEPLOY_REGION (data-residency note)"
        default: "Frankfurt"
        required: false
      droplet_name:
        description: "Server name. Use ssa-corpus for the PakistanLawSite server and ssa-corpus-public for the free-sites server"
        default: ssa-corpus
        required: true
      deploy_role:
        description: "What this server harvests: all, pls (PakistanLawSite only) or public (free sites only). keep = leave .env as it is"
        default: keep
        type: choice
        options: [keep, all, pls, public]
        required: false
      mirror_login_session_rows:
        description: "Copy PakistanLawSite judgments to the archive targets that opt in (Google Drive etc.)? keep = leave .env as it is"
        default: keep
        type: choice
        options: [keep, "true", "false"]
        required: false
      reader_model:
        description: "Model for the reading agent over unreported judgments (uses the server's OpenAI key). keep = leave .env as it is; off = stop it"
        default: keep
        type: choice
        options: [keep, gpt-4o-mini, gpt-4o, "off"]
        required: false

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client >/dev/null
          python3 -m pip install --quiet cryptography

      - name: Create or update the server and install the service
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          SGAI_API_KEY: ${{ secrets.SGAI_API_KEY }}
          CORPUS_API_KEY: ${{ secrets.CORPUS_API_KEY }}
          DO_REGION: ${{ inputs.do_region }}
          DO_SIZE: ${{ inputs.do_size }}
          DOMAIN: ${{ inputs.domain }}
          REPORTERS: ${{ inputs.reporters }}
          EARLIEST_YEAR: ${{ inputs.earliest_year }}
          DEPLOY_REGION_LABEL: ${{ inputs.deploy_region_label }}
          MIRROR_LOGIN_SESSION_ROWS: ${{ inputs.mirror_login_session_rows }}
          DROPLET_NAME: ${{ inputs.droplet_name }}
          DEPLOY_ROLE: ${{ inputs.deploy_role }}
          READER_MODEL_CHOICE: ${{ inputs.reader_model }}
          SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          test -n "$DO_TOKEN" || { echo "::error::Repository secret DO_TOKEN is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          bash cloud/do_deploy.sh
