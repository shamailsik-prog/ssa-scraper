name: corpus-service-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal_scraper_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U legal -d legal_scraper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://legal:legal@localhost:5432/legal_scraper_test
      REDIS_URL: redis://localhost:6379/0
      SIKANDER_READER_PASSWORD: readerpw
      CORPUS_WRITER_PASSWORD: writerpw
      CORPUS_API_READER_PASSWORD: corpusapipw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages (Tesseract for OCR tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr fonts-dejavu-core
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Byte-compile
        run: python -m compileall -q scraper migrations
      - name: Forbidden-pattern scan (no stubs, no secrets, no bypass logic)
        run: bash scripts/guard_scan.sh
      - name: Validate auto-deploy script
        run: bash -n scripts/auto_deploy.sh
      - name: xdist fresh cluster (no pre-created corpus roles)
        run: |
          PGPASSWORD=legal psql -h localhost -U legal -d legal_scraper_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'corpus_writer') THEN
              EXECUTE 'DROP OWNED BY corpus_writer CASCADE';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sikander_reader') THEN
              EXECUTE 'DROP OWNED BY sikander_reader CASCADE';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'corpus_api_reader') THEN
              EXECUTE 'DROP OWNED BY corpus_api_reader CASCADE';
            END IF;
          END
          $body$;
          SQL
          PGPASSWORD=legal psql -h localhost -U legal -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS corpus_writer;
          DROP ROLE IF EXISTS sikander_reader;
          DROP ROLE IF EXISTS corpus_api_reader;
          SQL
          DB_LOCK_ON_CATALOG=1 pytest -n 4 --dist loadgroup -q
      - name: Tests against PostgreSQL + Redis
        run: |
          PGPASSWORD=legal psql -h localhost -U legal -d legal_scraper_test -v ON_ERROR_STOP=1 <<'SQL'
          DO $body$
          BEGIN
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'corpus_writer') THEN
              EXECUTE 'DROP OWNED BY corpus_writer CASCADE';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sikander_reader') THEN
              EXECUTE 'DROP OWNED BY sikander_reader CASCADE';
            END IF;
            IF EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'corpus_api_reader') THEN
              EXECUTE 'DROP OWNED BY corpus_api_reader CASCADE';
            END IF;
          END
          $body$;
          SQL
          PGPASSWORD=legal psql -h localhost -U legal -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          DROP ROLE IF EXISTS corpus_writer;
          DROP ROLE IF EXISTS sikander_reader;
          DROP ROLE IF EXISTS corpus_api_reader;
          SQL
          pytest -q
      - name: xdist smoke (per-worker databases)
        run: |
          DB_LOCK_ON_CATALOG=1 pytest -n 2 --dist loadfile -q \
            tests/test_seed_idempotent.py \
            tests/test_pls_quality_guards.py \
            tests/test_pls_backfill_b4.py \
            tests/test_unreported_promotion.py
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
