name: connect-google-drive

# Registers a Google Drive folder as an archive target on the corpus server and checks, from the
# server, that the grant and the folder work. The hourly archive-mirror task then copies every
# promoted judgment, statute and instrument there.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   DO_TOKEN                          already set for deploy-cloud
#   GDRIVE_CLIENT_ID, GDRIVE_CLIENT_SECRET, GDRIVE_REFRESH_TOKEN
#                                     OAuth grant from the Google account that owns the folder
#                                     (personal gmail.com Drive; see docs/GOOGLE_DRIVE.md), or
#   GDRIVE_SERVICE_ACCOUNT_JSON       a service account added to a Workspace Shared Drive
# The credentials go to the server over SSH standard input and are stored encrypted; they are
# never printed.

on:
  workflow_dispatch:
    inputs:
      folder_id:
        description: "Drive folder id (the part after /folders/ in the folder's address)"
        required: true
      root_path:
        description: "Folder created inside it for the corpus"
        default: "SIKANDER_Corpus"
        required: false
      mirror_pakistanlawsite:
        description: "Also copy PakistanLawSite judgments to this Drive (true/false)"
        default: "true"
        required: false

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq openssh-client >/dev/null
          python3 -m pip install --quiet cryptography

      - name: Register the Drive folder on the server and verify it
        env:
          DO_TOKEN: ${{ secrets.DO_TOKEN }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
          GDRIVE_FOLDER_ID: ${{ inputs.folder_id }}
          ROOT_PATH: ${{ inputs.root_path }}
          MIRROR_LOGIN_SESSION_ROWS: ${{ inputs.mirror_pakistanlawsite }}
        run: |
          test -n "$DO_TOKEN" || { echo "::error::Repository secret DO_TOKEN is not set (Settings → Secrets and variables → Actions)"; exit 1; }
          bash cloud/do_connect_drive.sh
