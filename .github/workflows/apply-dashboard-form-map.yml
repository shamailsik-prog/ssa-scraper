name: apply-dashboard-form-map
on:
  push:
    branches: ["apply/pls-dashboard-form-map"]
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: apply ajax getElementById follow-up onto fix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin fix/pls-dashboard-citation-form-map
          git checkout -B work origin/fix/pls-dashboard-citation-form-map
          git apply --index patches/01-ajax-getelementbyid.patch
          git config user.name "grok-bot"
          git config user.email "shamailsik@gmail.com"
          git commit -m "fix(pls): use getElementById in ajax wait (CI bare-#id guard)"
          git push origin HEAD:refs/heads/fix/pls-dashboard-citation-form-map
