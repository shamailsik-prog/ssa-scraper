name: apply-dashboard-form-map
on:
  push:
    branches: ["apply/pls-dashboard-form-map"]
permissions:
  contents: write
  pull-requests: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: replace ajax querySelector with getElementById on fix branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch origin fix/pls-dashboard-citation-form-map
          git checkout -B work origin/fix/pls-dashboard-citation-form-map
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scraper/auth/session_manager.py')
          text = p.read_text()
          old = "if (document.querySelector('#archivedpatientGrid')) return true;\n                          const rm = document.querySelector('#rightmenu');"
          new = "if (document.getElementById('archivedpatientGrid')) return true;\n                          const rm = document.getElementById('rightmenu');"
          if old not in text:
              if "getElementById('archivedpatientGrid')" in text and "querySelector('#archivedpatientGrid')" not in text:
                  print('already fixed')
                  raise SystemExit(0)
              raise SystemExit('target snippet missing')
          p.write_text(text.replace(old, new, 1))
          print('patched')
          PY
          git add scraper/auth/session_manager.py
          git config user.name "grok-bot"
          git config user.email "shamailsik@gmail.com"
          git diff --cached --quiet && echo 'no changes' && exit 0
          git commit -m "fix(pls): use getElementById in ajax wait (CI bare-#id guard)"
          git push origin HEAD:refs/heads/fix/pls-dashboard-citation-form-map
