[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# A hung test fails with a stack trace instead of holding the run for hours (CI runs have stalled silently).
timeout = 600
timeout_method = thread
testpaths = tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
